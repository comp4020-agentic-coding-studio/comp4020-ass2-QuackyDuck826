<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Placeholder diagram of a physical prop, like a traffic-light-style light, stepping through three named states in sequence with the current state highlighted">
  <rect width="800" height="500" fill="#14100a"/>

  <!-- prop housing -->
  <rect x="320" y="60" width="160" height="360" rx="18" fill="#3f2a12"/>

  <!-- three state lamps, middle one active -->
  <circle cx="400" cy="140" r="46" fill="#5c3d16"/>
  <circle cx="400" cy="250" r="52" fill="#b97d1c"/>
  <circle cx="400" cy="360" r="46" fill="#5c3d16"/>

  <!-- glow around the active state -->
  <circle cx="400" cy="250" r="80" fill="#e7c98f" opacity="0.18"/>

  <!-- labels for each state -->
  <text x="400" y="145" font-family="monospace" font-size="16" fill="#8a5a20" text-anchor="middle">WAIT</text>
  <text x="400" y="256" font-family="monospace" font-size="18" fill="#14100a" text-anchor="middle">GO</text>
  <text x="400" y="365" font-family="monospace" font-size="16" fill="#8a5a20" text-anchor="middle">STOP</text>

  <!-- transition arrows cycling through the states -->
  <path d="M470,140 Q560,195 470,250" stroke="#f4ead9" stroke-width="4" fill="none" opacity="0.6"/>
  <path d="M470,250 Q560,305 470,360" stroke="#f4ead9" stroke-width="4" fill="none" opacity="0.6"/>
  <path d="M330,360 Q230,250 330,140" stroke="#f4ead9" stroke-width="4" fill="none" opacity="0.6"/>

  <text x="400" y="470" font-family="sans-serif" font-size="18" fill="#e7c98f" text-anchor="middle">placeholder — a prop cycling through named states</text>
</svg>
