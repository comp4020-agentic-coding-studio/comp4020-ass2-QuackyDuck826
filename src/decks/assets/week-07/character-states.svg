<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Placeholder screenshot of an on-screen character shown three times, in idle, walk and jump poses, one per state" >
  <rect width="800" height="500" fill="#f4ead9"/>

  <!-- ground -->
  <rect x="0" y="380" width="800" height="120" fill="#8a5a20"/>
  <rect x="0" y="380" width="800" height="10" fill="#5c3d16"/>

  <!-- idle figure -->
  <g>
    <ellipse cx="180" cy="330" rx="24" ry="30" fill="#b97d1c"/>
    <circle cx="180" cy="284" r="18" fill="#e7c98f"/>
    <rect x="166" y="330" width="12" height="44" fill="#5c3d16"/>
    <rect x="192" y="330" width="12" height="44" fill="#5c3d16"/>
    <rect x="130" y="34" width="100" height="34" rx="6" fill="#3f2a12"/>
    <text x="180" y="58" font-family="monospace" font-size="16" fill="#f4ead9" text-anchor="middle">IDLE</text>
  </g>

  <!-- walk figure, mid-stride -->
  <g>
    <ellipse cx="400" cy="330" rx="24" ry="30" fill="#b97d1c"/>
    <circle cx="400" cy="284" r="18" fill="#e7c98f"/>
    <rect x="378" y="330" width="12" height="44" fill="#5c3d16" transform="rotate(18 384 330)"/>
    <rect x="410" y="330" width="12" height="44" fill="#5c3d16" transform="rotate(-18 416 330)"/>
    <rect x="350" y="34" width="100" height="34" rx="6" fill="#3f2a12"/>
    <text x="400" y="58" font-family="monospace" font-size="16" fill="#f4ead9" text-anchor="middle">WALK</text>
  </g>

  <!-- jump figure, airborne with motion arcs -->
  <g>
    <ellipse cx="620" cy="260" rx="24" ry="30" fill="#b97d1c"/>
    <circle cx="620" cy="214" r="18" fill="#e7c98f"/>
    <rect x="602" y="260" width="12" height="30" fill="#5c3d16" transform="rotate(30 608 260)"/>
    <rect x="628" y="260" width="12" height="30" fill="#5c3d16" transform="rotate(-30 634 260)"/>
    <path d="M580,380 Q620,300 660,380" stroke="#5c3d16" stroke-width="4" fill="none" opacity="0.5"/>
    <rect x="570" y="34" width="100" height="34" rx="6" fill="#3f2a12"/>
    <text x="620" y="58" font-family="monospace" font-size="16" fill="#f4ead9" text-anchor="middle">JUMP</text>
  </g>

  <text x="400" y="470" font-family="sans-serif" font-size="18" fill="#8a5a20" text-anchor="middle">placeholder — one character, three named states</text>
</svg>
