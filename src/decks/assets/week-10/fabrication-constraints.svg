<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Placeholder diagram contrasting a laser cutter's kerf allowance, where a slot is cut slightly narrower than the tab that meshes into it, with a 3D printer's wall thickness, orientation and supports">
  <defs>
    <filter id="brush" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise" seed="7"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="10"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="#f4ead9"/>

  <!-- divider -->
  <line x1="400" y1="40" x2="400" y2="420" stroke="#e7c98f" stroke-width="4"/>

  <!-- left panel: laser kerf allowance -->
  <text x="200" y="70" font-family="sans-serif" font-size="24" font-weight="bold" fill="#3f2a12" text-anchor="middle">Laser: kerf allowance</text>

  <!-- tab piece -->
  <g filter="url(#brush)">
    <rect x="60" y="140" width="120" height="90" fill="#b97d1c"/>
    <rect x="140" y="150" width="40" height="70" fill="#8a5a20"/>
  </g>
  <text x="120" y="255" font-family="sans-serif" font-size="16" fill="#5c3d16" text-anchor="middle">tab</text>

  <!-- slot piece, slightly narrower slot than tab -->
  <g filter="url(#brush)">
    <rect x="240" y="140" width="120" height="90" fill="#e7c98f"/>
    <rect x="305" y="150" width="30" height="70" fill="#f4ead9"/>
  </g>
  <text x="300" y="255" font-family="sans-serif" font-size="16" fill="#5c3d16" text-anchor="middle">slot (narrower)</text>

  <!-- meshed result -->
  <g filter="url(#brush)">
    <rect x="130" y="320" width="140" height="90" fill="#8a5a20"/>
    <rect x="185" y="300" width="30" height="130" fill="#5c3d16"/>
  </g>
  <text x="200" y="435" font-family="sans-serif" font-size="16" fill="#5c3d16" text-anchor="middle">tab meshes tight into slot</text>

  <!-- right panel: 3D print constraints -->
  <text x="600" y="70" font-family="sans-serif" font-size="24" font-weight="bold" fill="#3f2a12" text-anchor="middle">Printer: wall + orientation</text>

  <!-- printed block with thin vs thick wall -->
  <g filter="url(#brush)">
    <rect x="480" y="140" width="90" height="120" fill="#b97d1c"/>
    <rect x="486" y="146" width="8" height="108" fill="#f4ead9"/>
  </g>
  <text x="525" y="278" font-family="sans-serif" font-size="16" fill="#5c3d16" text-anchor="middle">wall too thin: fails</text>

  <g filter="url(#brush)">
    <rect x="610" y="140" width="90" height="120" fill="#8a5a20"/>
    <rect x="622" y="152" width="30" height="96" fill="#3f2a12"/>
  </g>
  <text x="655" y="278" font-family="sans-serif" font-size="16" fill="#5c3d16" text-anchor="middle">wall thick enough</text>

  <!-- overhang needing support -->
  <g filter="url(#brush)">
    <rect x="540" y="330" width="120" height="30" fill="#8a5a20"/>
    <rect x="560" y="360" width="16" height="50" fill="#5c3d16"/>
    <rect x="624" y="360" width="16" height="50" fill="#5c3d16"/>
  </g>
  <text x="600" y="430" font-family="sans-serif" font-size="16" fill="#5c3d16" text-anchor="middle">overhang held by supports</text>

  <text x="400" y="470" font-family="sans-serif" font-size="18" fill="#8a5a20" text-anchor="middle">placeholder — laser kerf allowance vs. 3D print wall thickness, orientation and supports</text>
</svg>
