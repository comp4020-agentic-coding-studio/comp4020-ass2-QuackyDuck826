<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Placeholder illustration of a laser-cut kinetic mechanism: two meshed cardboard gears driving a simple crank-and-slider linkage on a flat cut sheet">
  <rect width="800" height="500" fill="#f4ead9"/>

  <!-- cut sheet, with a dashed border suggesting the laser's outer cut path -->
  <rect x="60" y="60" width="680" height="380" fill="#e7c98f" opacity="0.4"/>
  <rect x="60" y="60" width="680" height="380" fill="none" stroke="#8a5a20" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- large gear -->
  <g>
    <g fill="#8a5a20">
      <rect x="246" y="150" width="28" height="40" transform="rotate(0 260 260)"/>
      <rect x="246" y="150" width="28" height="40" transform="rotate(45 260 260)"/>
      <rect x="246" y="150" width="28" height="40" transform="rotate(90 260 260)"/>
      <rect x="246" y="150" width="28" height="40" transform="rotate(135 260 260)"/>
      <rect x="246" y="150" width="28" height="40" transform="rotate(180 260 260)"/>
      <rect x="246" y="150" width="28" height="40" transform="rotate(225 260 260)"/>
      <rect x="246" y="150" width="28" height="40" transform="rotate(270 260 260)"/>
      <rect x="246" y="150" width="28" height="40" transform="rotate(315 260 260)"/>
    </g>
    <circle cx="260" cy="260" r="70" fill="#b97d1c"/>
    <circle cx="260" cy="260" r="22" fill="#f4ead9" stroke="#3f2a12" stroke-width="4"/>
  </g>

  <!-- small meshed gear -->
  <g>
    <g fill="#5c3d16">
      <rect x="378" y="222" width="18" height="26" transform="rotate(0 390 260)"/>
      <rect x="378" y="222" width="18" height="26" transform="rotate(45 390 260)"/>
      <rect x="378" y="222" width="18" height="26" transform="rotate(90 390 260)"/>
      <rect x="378" y="222" width="18" height="26" transform="rotate(135 390 260)"/>
      <rect x="378" y="222" width="18" height="26" transform="rotate(180 390 260)"/>
      <rect x="378" y="222" width="18" height="26" transform="rotate(225 390 260)"/>
      <rect x="378" y="222" width="18" height="26" transform="rotate(270 390 260)"/>
      <rect x="378" y="222" width="18" height="26" transform="rotate(315 390 260)"/>
    </g>
    <circle cx="390" cy="260" r="38" fill="#8a5a20"/>
    <circle cx="390" cy="260" r="12" fill="#f4ead9" stroke="#3f2a12" stroke-width="3"/>
  </g>

  <!-- crank arm driven off the small gear, ending in a slider -->
  <g stroke="#3f2a12" stroke-width="10" stroke-linecap="round">
    <line x1="390" y1="260" x2="560" y2="330"/>
  </g>
  <circle cx="390" cy="260" r="8" fill="#14100a"/>
  <circle cx="560" cy="330" r="8" fill="#14100a"/>

  <!-- slider block riding a track -->
  <rect x="520" y="360" width="220" height="14" rx="4" fill="#5c3d16"/>
  <rect x="536" y="316" width="48" height="34" rx="4" fill="#b97d1c" stroke="#3f2a12" stroke-width="3"/>

  <text x="400" y="460" font-family="sans-serif" font-size="18" fill="#8a5a20" text-anchor="middle">placeholder — laser-cut kinetic mechanism</text>
</svg>
