<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Placeholder illustration of a 3D-printed enclosure housing a small sensor board, shown as a flat isometric box with visible print layer lines and a cutout revealing the board inside">
  <rect width="800" height="500" fill="#291c06"/>

  <!-- print bed grid -->
  <g stroke="#5a3c0c" stroke-width="1">
    <line x1="0" y1="430" x2="800" y2="430"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="0" y1="470" x2="800" y2="470"/>
  </g>

  <!-- isometric enclosure box: top, front, side faces -->
  <polygon points="260,140 460,140 540,190 340,190" fill="#e3cba4"/>
  <polygon points="260,140 340,190 340,360 260,310" fill="#8a5c13"/>
  <polygon points="340,190 540,190 540,360 340,360" fill="#b97d1c"/>

  <!-- print layer lines on the visible front face -->
  <g stroke="#5a3c0c" stroke-width="1.5" opacity="0.6">
    <line x1="345" y1="210" x2="535" y2="210"/>
    <line x1="345" y1="230" x2="535" y2="230"/>
    <line x1="345" y1="250" x2="535" y2="250"/>
    <line x1="345" y1="270" x2="535" y2="270"/>
    <line x1="345" y1="290" x2="535" y2="290"/>
    <line x1="345" y1="310" x2="535" y2="310"/>
    <line x1="345" y1="330" x2="535" y2="330"/>
    <line x1="345" y1="350" x2="535" y2="350"/>
  </g>

  <!-- cutout window revealing the sensor board inside -->
  <rect x="380" y="240" width="120" height="80" rx="4" fill="#291c06"/>
  <rect x="392" y="252" width="96" height="56" rx="2" fill="#5a3c0c"/>
  <rect x="400" y="260" width="40" height="12" fill="#f4ead9"/>
  <circle cx="460" cy="288" r="10" fill="#b97d1c"/>
  <line x1="392" y1="278" x2="488" y2="278" stroke="#8a5c13" stroke-width="2"/>

  <!-- cable exiting the enclosure -->
  <path d="M540,300 C 600,300 610,340 660,340" fill="none" stroke="#e3cba4" stroke-width="6" stroke-linecap="round"/>

  <text x="400" y="410" font-family="sans-serif" font-size="18" fill="#e3cba4" text-anchor="middle">placeholder — 3D-printed sensor enclosure</text>
</svg>
