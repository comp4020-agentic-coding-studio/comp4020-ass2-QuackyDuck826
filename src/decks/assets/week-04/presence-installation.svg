<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Placeholder illustration of a small gallery installation with a distance sensor watching a visitor's silhouette approach">
  <rect width="800" height="500" fill="#14100a"/>

  <!-- floor -->
  <rect x="0" y="400" width="800" height="100" fill="#3f2a12"/>

  <!-- plinth -->
  <rect x="120" y="330" width="160" height="70" fill="#5c3d16"/>

  <!-- installation piece on the plinth -->
  <g>
    <rect x="150" y="240" width="100" height="90" rx="8" fill="#8a5a20"/>
    <circle cx="200" cy="260" r="10" fill="#f4ead9"/>
    <rect x="185" y="285" width="30" height="30" rx="4" fill="#3f2a12"/>
  </g>

  <!-- sensor's cone of detection -->
  <path d="M200,255 L520,140 L520,380 Z" fill="#b97d1c" opacity="0.18"/>

  <!-- visitor silhouette approaching -->
  <g fill="#b97d1c">
    <circle cx="560" cy="300" r="24"/>
    <path d="M560,324 Q520,340 520,410 L600,410 Q600,340 560,324 Z"/>
  </g>

  <!-- distance readout, small numeric indicator -->
  <g>
    <rect x="24" y="24" width="170" height="44" rx="6" fill="#3f2a12" opacity="0.9"/>
    <text x="40" y="53" font-family="monospace" font-size="18" fill="#f4ead9">DIST 042 cm</text>
  </g>

  <text x="400" y="470" font-family="sans-serif" font-size="18" fill="#e7c98f" text-anchor="middle">placeholder — presence-aware installation</text>
</svg>
