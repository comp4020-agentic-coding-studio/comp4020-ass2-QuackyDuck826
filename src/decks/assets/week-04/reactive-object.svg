<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Placeholder illustration of an ordinary object whose colour shifts subtly in response to a light sensor reading">
  <rect width="800" height="500" fill="#f4ead9"/>

  <!-- tabletop -->
  <rect x="0" y="360" width="800" height="140" fill="#8a5c13"/>

  <!-- ambient light sensor mounted nearby -->
  <g>
    <rect x="560" y="220" width="20" height="140" fill="#5a3c0c"/>
    <circle cx="570" cy="210" r="18" fill="#5a3c0c"/>
    <circle cx="570" cy="210" r="8" fill="#bbcdea"/>
  </g>

  <!-- light rays hitting the sensor -->
  <g stroke="#b97d1c" stroke-width="4" opacity="0.6">
    <line x1="620" y1="120" x2="580" y2="195"/>
    <line x1="660" y1="160" x2="590" y2="205"/>
    <line x1="640" y1="220" x2="590" y2="215"/>
  </g>

  <!-- the reactive object itself, three panels showing a colour gradient response -->
  <g>
    <rect x="180" y="240" width="90" height="120" rx="10" fill="#5a3c0c"/>
    <rect x="290" y="220" width="90" height="140" rx="10" fill="#8a5c13"/>
    <rect x="400" y="200" width="90" height="160" rx="10" fill="#bbcdea"/>
  </g>

  <!-- arrow suggesting the sensor drives the object's state -->
  <path d="M540,270 Q460,270 400,270" fill="none" stroke="#5a3c0c" stroke-width="4" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5a3c0c"/>
    </marker>
  </defs>

  <text x="400" y="460" font-family="sans-serif" font-size="18" fill="#8a5c13" text-anchor="middle">placeholder — a sensor reading driving a subtle visible change</text>
</svg>
