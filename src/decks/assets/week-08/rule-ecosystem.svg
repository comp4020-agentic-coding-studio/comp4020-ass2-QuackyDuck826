<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Placeholder screenshot of a small simulated ecosystem with a few simple agents, shown as geometric shapes moving and interacting under shared rules" >
  <rect width="800" height="500" fill="#3f2a12"/>

  <!-- loose grid, suggesting a bounded simulation space -->
  <g stroke="#5c3d16" stroke-width="1" opacity="0.5">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- "prey" agents: small cream circles -->
  <circle cx="150" cy="150" r="14" fill="#f4ead9"/>
  <circle cx="260" cy="210" r="14" fill="#f4ead9"/>
  <circle cx="330" cy="120" r="14" fill="#f4ead9"/>
  <circle cx="520" cy="330" r="14" fill="#f4ead9"/>
  <circle cx="610" cy="150" r="14" fill="#f4ead9"/>

  <!-- "predator" agents: gold triangles -->
  <polygon points="420,220 445,270 395,270" fill="#b97d1c"/>
  <polygon points="650,300 675,350 625,350" fill="#b97d1c"/>

  <!-- interaction lines showing a rule connecting two nearby agents -->
  <path d="M420,240 L330,140" stroke="#e7c98f" stroke-width="2" stroke-dasharray="6 6" opacity="0.8"/>
  <path d="M650,320 L610,170" stroke="#e7c98f" stroke-width="2" stroke-dasharray="6 6" opacity="0.8"/>

  <!-- one "particle" agent trailing behind -->
  <circle cx="200" cy="420" r="8" fill="#8a5a20"/>
  <circle cx="220" cy="410" r="6" fill="#8a5a20" opacity="0.6"/>
  <circle cx="238" cy="402" r="4" fill="#8a5a20" opacity="0.35"/>

  <text x="400" y="470" font-family="sans-serif" font-size="18" fill="#e7c98f" text-anchor="middle">placeholder — a few rule-driven agents in one shared space</text>
</svg>
