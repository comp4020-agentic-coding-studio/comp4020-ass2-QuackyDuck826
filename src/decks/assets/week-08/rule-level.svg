<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Placeholder screenshot of a small rule-based game level with platforms, a ball, a switch and a gate, illustrating simple physics and collision rules" >
  <rect width="800" height="500" fill="#f4ead9"/>

  <!-- sky/background band -->
  <rect x="0" y="0" width="800" height="360" fill="#e3cba4"/>

  <!-- platforms -->
  <rect x="0" y="360" width="320" height="140" fill="#8a5c13"/>
  <rect x="480" y="360" width="320" height="140" fill="#8a5c13"/>
  <rect x="320" y="420" width="160" height="80" fill="#5a3c0c"/>

  <!-- gate, currently closed -->
  <rect x="600" y="220" width="24" height="140" fill="#5a3c0c"/>
  <rect x="600" y="220" width="24" height="140" fill="#5a3c0c" opacity="0.9"/>

  <!-- switch, unpressed -->
  <rect x="360" y="380" width="60" height="16" rx="4" fill="#b97d1c"/>
  <rect x="380" y="360" width="20" height="20" fill="#b97d1c"/>

  <!-- ball, mid-arc toward the switch -->
  <circle cx="200" cy="300" r="26" fill="#b97d1c"/>
  <path d="M100,220 Q160,260 200,300" stroke="#8a5c13" stroke-width="3" fill="none" stroke-dasharray="4 8" opacity="0.7"/>

  <!-- rule arrow: switch triggers gate -->
  <path d="M400,370 Q500,280 610,220" stroke="#5a3c0c" stroke-width="3" fill="none" stroke-dasharray="2 6"/>
  <polygon points="605,210 622,218 608,232" fill="#5a3c0c"/>

  <text x="400" y="470" font-family="sans-serif" font-size="18" fill="#8a5c13" text-anchor="middle">placeholder — a ball, a switch, and a gate, composed by rule</text>
</svg>
