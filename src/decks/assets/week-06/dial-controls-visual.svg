<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Placeholder illustration of a hand turning a physical dial on a small board, connected by a cable to a laptop screen showing a generative visual pattern changing live">
  <rect width="800" height="500" fill="#f4ead9"/>

  <!-- desk -->
  <rect x="0" y="380" width="800" height="120" fill="#8a5c13"/>

  <!-- physical dial / board on the left -->
  <g>
    <rect x="90" y="290" width="180" height="90" rx="10" fill="#5a3c0c"/>
    <circle cx="180" cy="300" r="42" fill="#5a3c0c"/>
    <circle cx="180" cy="300" r="42" fill="none" stroke="#f4ead9" stroke-width="3"/>
    <line x1="180" y1="300" x2="205" y2="270" stroke="#bbcdea" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- serial cable -->
  <path d="M270,335 Q400,360 470,320" fill="none" stroke="#5a3c0c" stroke-width="6"/>

  <!-- laptop with generative visual -->
  <g>
    <rect x="470" y="180" width="260" height="170" rx="8" fill="#291c06"/>
    <rect x="486" y="196" width="228" height="138" fill="#f4ead9"/>
    <circle cx="560" cy="265" r="30" fill="#b97d1c"/>
    <circle cx="620" cy="240" r="18" fill="#8a5c13"/>
    <circle cx="650" cy="290" r="24" fill="#5a3c0c"/>
    <rect x="440" y="350" width="320" height="18" rx="4" fill="#5a3c0c"/>
  </g>

  <text x="400" y="460" font-family="sans-serif" font-size="18" fill="#8a5c13" text-anchor="middle">placeholder — a physical dial driving a generative visual live</text>
</svg>
