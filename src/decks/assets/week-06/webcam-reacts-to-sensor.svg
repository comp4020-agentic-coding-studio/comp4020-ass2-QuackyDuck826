<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Placeholder illustration of a projected visual on a wall shifting colour as a physical sensor reading arrives over a serial cable from a small board"><rect width="800" height="500" fill="#291c06"/>

  <!-- projector -->
  <g>
    <rect x="580" y="360" width="90" height="50" rx="6" fill="#5a3c0c"/>
    <circle cx="600" cy="385" r="10" fill="#bbcdea"/>
  </g>

  <!-- projection beam -->
  <polygon points="600,375 620,375 200,140 160,160" fill="#f4ead9" opacity="0.08"/>

  <!-- projected image on the wall, split to show a shift mid-response -->
  <g>
    <rect x="80" y="60" width="380" height="260" fill="#5a3c0c"/>
    <rect x="80" y="60" width="190" height="260" fill="#8a5c13"/>
    <circle cx="270" cy="190" r="70" fill="#bbcdea" opacity="0.85"/>
    <circle cx="200" cy="130" r="30" fill="#b97d1c" opacity="0.7"/>
  </g>

  <!-- small board with sensor sitting near the wall -->
  <g>
    <rect x="90" y="360" width="120" height="60" rx="8" fill="#5a3c0c"/>
    <circle cx="200" cy="380" r="12" fill="#bbcdea"/>
  </g>

  <!-- serial cable running from the board off toward the projector's control laptop, implied off-frame -->
  <path d="M210,390 Q400,430 580,400" fill="none" stroke="#8a5c13" stroke-width="5"/>

  <text x="400" y="470" font-family="sans-serif" font-size="18" fill="#bbcdea" text-anchor="middle">placeholder — a projected visual responding to a sensor over serial</text>
</svg>
